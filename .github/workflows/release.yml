name: release

# Push a tag vX.Y.Z -> run the tests, build the wheel and sdist, and publish a GitHub
# Release whose notes are that version's CHANGELOG section and whose assets carry a
# SHA256SUMS file, so downloads can be verified.

on:
  push:
    tags: ["v*.*.*"]
  # Manual run from the default branch: creates the tag v<package version> on the
  # current commit, then publishes the same release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: resolve tag
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
          else
            test "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" \
              || { echo "manual releases run only from the default branch"; exit 1; }
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: test
        run: |
          pip install -e ".[dev]"
          pytest -m "not network" -q
      - name: build
        run: |
          pip install build
          python -m build
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: release notes from CHANGELOG
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $v"; exit 1; }
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          else
            gh release view "$TAG" >/dev/null 2>&1 && { echo "$TAG already released"; exit 1; }
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
