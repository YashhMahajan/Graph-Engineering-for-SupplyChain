name: publish to PyPI

# Run by hand after a release. It builds the tagged version and publishes it as
# `scgraph-cli` with PyPI Trusted Publishing (OpenID Connect), so no token is stored.
# One-time setup on pypi.org: add a trusted publisher for this repository, workflow
# `publish-pypi.yml`, environment `pypi`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.2.1"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: check the tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG" || { echo "tag $TAG != v$v"; exit 1; }
      - name: build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
